<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ESP32 Control Hub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Tahoma,sans-serif;background:linear-gradient(135deg,#0f0c29,#24243e);color:#fff;min-height:100vh;padding:20px}
.c{max-width:800px;margin:0 auto}
.h{background:linear-gradient(135deg,#0d7377,#14a0a8);padding:30px 20px;border-radius:20px;text-align:center;margin-bottom:20px}
.h h1{font-size:26px;margin-bottom:8px}
.h p{opacity:.9;font-size:14px}
.card{background:rgba(255,255,255,.05);border-radius:16px;padding:20px;margin-bottom:16px;border:1px solid rgba(255,255,255,.08)}
.card h2{font-size:16px;margin-bottom:16px;color:#5eead4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.btn{padding:20px 12px;border-radius:14px;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#fff;cursor:pointer;font-family:inherit;font-size:14px;font-weight:bold;transition:all .25s;display:flex;flex-direction:column;align-items:center;gap:8px}
.btn:hover{transform:translateY(-3px)}
.btn.on{background:linear-gradient(135deg,#10b981,#059669);border-color:#10b981}
.btn .icon{font-size:28px}
.btn .state{font-size:11px;opacity:.75}
.footer{text-align:center;padding:30px;color:#94a3b8;font-size:12px}
</style>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d7377">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Control Hub">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
</head>
<body>
<div class="c">
<div class="h">
<h1>ESP32 Control Hub</h1>
<p>نظام تحكم متكامل</p>
</div>
<div class="card">
<h2>الحساسات</h2>
<div class="grid" id="sensors"></div>
</div>
<div class="card">
<h2>التحكم</h2>
<div class="grid" id="buttons"></div>
</div>
<div class="footer">ESP32 Control Hub</div>
</div>
<script>
async function api(p){const r=await fetch(p);return r.json();}
async function loadConfig(){
  const c=await api('/api/config');
  document.getElementById('buttons').innerHTML=c.buttons.map(function(b){
    return '<button class="btn" data-pin="'+b.pin+'" onclick="toggle(\''+b.pin+'\')"><span class="icon">'+b.icon+'</span><span>'+b.name+'</span><span class="state">OFF</span></button>';
  }).join('');
}
async function loadState(){
  const s=await api('/api/state');
  document.querySelectorAll('.btn').forEach(function(b){
    var st=s[b.dataset.pin]?1:0;
    b.classList.toggle('on',st===1);
    b.querySelector('.state').textContent=st?'ON':'OFF';
  });
}
async function loadSensors(){
  const s=await api('/api/sensors');
  document.getElementById('sensors').innerHTML='<div class="st"><div class="sn">'+s.temperature+'</div><div class="sl">Temp</div></div><div class="st"><div class="sn">'+s.humidity+'</div><div class="sl">Hum</div></div>';
}
async function toggle(pin){
  await api('/api/toggle?pin='+pin);
  loadState();
}
loadConfig();loadState();loadSensors();
setInterval(loadSensors,5000);
setInterval(loadState,3000);
</script>

<!-- PWA Install Banner -->
<div id="installBanner" style="display:none;position:fixed;bottom:20px;left:20px;right:20px;background:linear-gradient(135deg,#0d7377,#14a0a8);color:#fff;padding:16px 20px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:999;align-items:center;gap:12px">
  <div style="font-size:32px">📱</div>
  <div style="flex:1">
    <div style="font-weight:bold;margin-bottom:4px">ثبت التطبيق</div>
    <div style="font-size:12px;opacity:.9">اضغط للتثبيت على شاشتك الرئيسية</div>
  </div>
  <button onclick="installPWA()" style="background:#fff;color:#0d7377;border:none;padding:10px 20px;border-radius:10px;font-weight:bold;cursor:pointer;font-family:inherit">تثبيت</button>
  <button onclick="closeBanner()" style="background:transparent;color:#fff;border:none;font-size:24px;cursor:pointer;padding:0 8px">x</button>
</div>

<script>
// Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js')
      .then(function(reg) { console.log('SW registered'); })
      .catch(function(err) { console.log('SW failed:', err); });
  });
}

// Install prompt
var deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredPrompt = e;
  if (!localStorage.getItem('pwaDismissed')) {
    document.getElementById('installBanner').style.display = 'flex';
  }
});

function installPWA() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function(choice) {
    if (choice.outcome === 'accepted') {
      console.log('PWA installed');
    }
    deferredPrompt = null;
    document.getElementById('installBanner').style.display = 'none';
  });
}

function closeBanner() {
  document.getElementById('installBanner').style.display = 'none';
  localStorage.setItem('pwaDismissed', '1');
}
</script>
</body>
</html>

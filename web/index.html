<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ESP32 Hub</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d7377">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,Arial,sans-serif;background:#0f0f1a;color:#fff;min-height:100vh;padding:15px;font-size:15px}
.c{max-width:700px;margin:0 auto}
.h{background:linear-gradient(135deg,#0d7377,#14a0a8);padding:25px 15px;border-radius:15px;text-align:center;margin-bottom:15px}
.h h1{font-size:22px;margin-bottom:5px}
.h p{font-size:13px;opacity:.9}
.card{background:#1a1a2e;border-radius:12px;padding:15px;margin-bottom:12px;border:1px solid #2a2a40}
.card h2{font-size:14px;margin-bottom:12px;color:#5eead4}
.sensors{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sensor{background:#0a0a1a;border-radius:10px;padding:12px;text-align:center}
.sensor .value{font-size:24px;font-weight:bold;color:#5eead4}
.sensor .label{font-size:11px;color:#94a3b8;margin-top:3px}
.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.btn{padding:18px 8px;border-radius:12px;border:2px solid #2a2a40;background:#0a0a1a;color:#fff;cursor:pointer;font-family:inherit;font-size:14px;font-weight:bold;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn.on{background:linear-gradient(135deg,#10b981,#059669);border-color:#10b981}
.btn .icon{font-size:22px}
.btn .name{font-size:12px}
.btn .state{font-size:10px;opacity:.7}
.footer{text-align:center;padding:15px;color:#64748b;font-size:11px}
</style>
</head>
<body>
<div class="c">
<div class="h">
<h1>ESP32 Control Hub</h1>
<p>نظام تحكم متكامل</p>
</div>

<div class="card">
<h2>الحساسات</h2>
<div class="sensors">
<div class="sensor"><div class="value" id="temp">--</div><div class="label">حرارة C</div></div>
<div class="sensor"><div class="value" id="hum">--</div><div class="label">رطوبة %</div></div>
</div>
</div>

<div class="card">
<h2>التحكم</h2>
<div class="buttons" id="buttons"></div>
</div>

<div class="footer">ESP32 Control Hub</div>
</div>

<script>
function get(url){return fetch(url).then(function(r){return r.json();});}
function renderButtons(btns){
  var html='';
  for(var i=0;i<btns.length;i++){
    var b=btns[i];
    html+='<button class="btn" data-pin="'+b.pin+'" onclick="toggle(\''+b.pin+'\')"><span class="icon">'+b.icon+'</span><span class="name">'+b.name+'</span><span class="state">--</span></button>';
  }
  document.getElementById('buttons').innerHTML=html;
}
function loadConfig(){return get('/api/config').then(function(c){if(c.buttons)renderButtons(c.buttons);});}
function loadState(){return get('/api/state').then(function(s){
  var btns=document.querySelectorAll('.btn');
  for(var i=0;i<btns.length;i++){
    var p=btns[i].dataset.pin;
    var st=s[p]?1:0;
    btns[i].classList.toggle('on',st===1);
    btns[i].querySelector('.state').textContent=st?'ON':'OFF';
  }
});}
function loadSensors(){return get('/api/sensors').then(function(s){
  document.getElementById('temp').textContent=s.temperature||'--';
  document.getElementById('hum').textContent=s.humidity||'--';
});}
function toggle(pin){return get('/api/toggle?pin='+pin).then(function(){return loadState();});}
loadConfig().then(function(){return loadState();});
loadSensors();
setInterval(loadSensors,5000);
setInterval(loadState,3000);
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(function(){});}
</script>
</body>
</html>
